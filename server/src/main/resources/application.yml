app:
  name: angular-spring-jwt

jwt:
  header: Authorization
  expires_in: 600 # 10 minutes
  secret: queenvictoriaqueenvictoriaqueenvictoria  # Must be at least 256 bits for HS256
  cookie: AUTH-TOKEN

spring:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=USER,AUTHORITY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

logging:
  level:
    org.springframework.web: ERROR
    com.bfwg: DEBUG
    org.springframework.security: DEBUG
